version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "composer"
    directory: "/packages/keycloak-admin-client"
    schedule:
      interval: "weekly"

  - package-ecosystem: "composer"
    directory: "/packages/keycloak-admin-bundle"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
